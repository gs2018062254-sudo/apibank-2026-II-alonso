name: Sonar Continuous Integration

env:
  DOTNET_VERSION: '10.x'
  SONAR_ORG: 'apibank-alonso'
  SONAR_PROJECT: 'apibank-2026-II-alonso'

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurando la versión de .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Instalar Scanner
        run: dotnet tool install -g dotnet-sonarscanner

      - name: Ejecutar pruebas
        run: |
          dotnet restore
          dotnet test --collect:"XPlat Code Coverage;Format=opencover"

      - name: Iniciar análisis SonarCloud
        run: |
          dotnet-sonarscanner begin \
            /k:"${{ env.SONAR_PROJECT }}" \
            /o:"${{ env.SONAR_ORG }}" \
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.cs.opencover.reportsPaths="*/*/*/coverage.opencover.xml" \
            /d:sonar.qualitygate.wait=true

      - name: Construir proyecto
        run: dotnet build --no-incremental

      - name: Finalizar análisis SonarCloud
        run: |
          dotnet-sonarscanner end \
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

      - name: Construir paquete NuGet
        run: |
          dotnet pack ./Bank.Domain/Bank.Domain.csproj \
            --configuration Release \
            --output ./packages

      - name: Publicar paquete en GitHub Packages
        run: |
          dotnet nuget push "./packages/*.nupkg" \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --skip-duplicate
