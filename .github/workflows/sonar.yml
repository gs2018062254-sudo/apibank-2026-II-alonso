name: Sonar Continuous Integration

env:
  DOTNET_VERSION: '8.x'
  SONAR_ORG: 'apibank-alonso'
  SONAR_PROJECT: 'apibank-2026-II-alonso'

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:

  sonarqube:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Instalar SonarScanner
        run: dotnet tool install -g dotnet-sonarscanner

      - name: Restaurar dependencias
        run: dotnet restore

      - name: Iniciar analisis SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "Falta el secreto SONAR_TOKEN en el repositorio."
            exit 1
          fi

          dotnet-sonarscanner begin \
            /k:"${{ env.SONAR_PROJECT }}" \
            /o:"${{ env.SONAR_ORG }}" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" \
            /d:sonar.qualitygate.wait=true

      - name: Compilar proyecto
        run: dotnet build --no-incremental --configuration Release

      - name: Ejecutar pruebas y cobertura
        run: dotnet test --configuration Release --no-build --collect:"XPlat Code Coverage;Format=opencover"

      - name: Finalizar analisis SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet-sonarscanner end \
            /d:sonar.token="$SONAR_TOKEN"


  nuget:
    name: Construir y publicar paquete NuGet
    runs-on: ubuntu-latest
    needs: sonarqube

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restaurar dependencias
        run: dotnet restore

      - name: Construir paquete NuGet
        run: |
          dotnet pack ./Bank.Domain/Bank.Domain.csproj \
            --configuration Release \
            --output ./packages

      - name: Publicar paquete en GitHub Packages
        run: |
          dotnet nuget push "./packages/*.nupkg" \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --skip-duplicate

      - name: Guardar paquete NuGet
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: ./packages/*.nupkg


  release:
    name: Crear Release 1.0.0
    runs-on: ubuntu-latest
    needs: nuget

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Descargar paquete NuGet
        uses: actions/download-artifact@v4
        with:
          name: nuget-package
          path: ./packages

      - name: Crear notas de cambios
        run: |
          echo "## Modificaciones del paquete Bank.Domain 1.0.0" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "Cambios realizados segun los commits:" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          git log --pretty=format:"- %s (%h)" -n 10 >> RELEASE_NOTES.md

      - name: Crear Release 1.0.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0.0 \
            --title "Bank.Domain v1.0.0" \
            --notes-file RELEASE_NOTES.md \
            ./packages/*.nupkg